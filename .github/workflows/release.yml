name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  Windows_32bit:
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Configure CMake
        run: cmake -DCMAKE_BUILD_TYPE=Release -S . -B build -A Win32
      - name: Build
        run: cmake --build build --config Release
      - name: Hash
        id: hash
        shell: pwsh
        run: |
          $sha256 = (Get-FileHash xiloader.exe -Algorithm SHA256).Hash.ToLower()
          $md5 = (Get-FileHash xiloader.exe -Algorithm MD5).Hash
          "$sha256  xiloader.exe" | Out-File -Encoding ascii -NoNewline xiloader.exe.sha256
          "sha256=$sha256" >> $env:GITHUB_OUTPUT
          "md5=$md5" >> $env:GITHUB_OUTPUT
      # The publisher pins releases by sha256; the .sha256 asset and the body both carry it.
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "SHA256: ${{ steps.hash.outputs.sha256 }}`nMD5: ${{ steps.hash.outputs.md5 }}"
          gh release create "${{ github.ref_name }}" xiloader.exe xiloader.exe.sha256 --title "${{ github.ref_name }}" --notes $notes
